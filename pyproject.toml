[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "codeforge"
version = "0.1.0"
description = "CodeForge AI - Local-first AI coding assistant"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "CodeForge Team"}
]
keywords = ["ai", "coding", "assistant", "local", "pytorch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "click>=8.1",
    "rich>=13.0",
    "psutil>=5.9",
    "py-cpuinfo>=9.0",
    "httpx>=0.25",
    "websockets>=12.0",
    "python-dotenv>=1.0",
    "structlog>=23.0",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.1.0",
    "nvidia-ml-py>=12.0",
]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.1",
    "mypy>=1.7",
    "ruff>=0.1.0",
]
all = [
    "codeforge[gpu]",
    "codeforge[dev]",
]

[project.scripts]
codeforge = "codeforge.cli:main"

[project.urls]
Homepage = "https://github.com/CodeForge-AI/CodeForge-AI"

[tool.setuptools.packages.find]
where = ["."]
include = ["codeforge*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "COM", "C4", "DTZ", "ISC", "ICN", "PIE", "PT", "RSE", "RET", "SLF", "SIM", "TID", "TCH", "ARG", "PTH", "ERA"]
ignore = ["COM812", "ISC001", "S110", "S112", "S607", "PTH123"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S108", "ARG002"]
"codeforge/cli.py" = ["ARG001"]

[tool.ruff.lint.isort]
known-first-party = ["codeforge"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["cpuinfo.*", "psutil.*", "torch.*", "pynvml", "transformers", "sentencepiece", "safetensors.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests requiring GPU",
    "integration: marks integration tests",
]
